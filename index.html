<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Questions - Pro</title>
<style>
:root{--bg:#EDF1F4;--card:#fff;--ink:#16212B;--muted:#53636F;--line:#D3DBE2;--accent:#0B6E8A;--accent-ink:#fff;--code:#E6ECF0;--note-bg:#FBEBCF;--note:#8A4B00}
@media (prefers-color-scheme:dark){:root{--bg:#0E1419;--card:#17202A;--ink:#E6EDF3;--muted:#9AAAB7;--line:#27353F;--accent:#5CC0DE;--accent-ink:#06222C;--code:#0B1116;--note-bg:#3A2A0E;--note:#F0B85A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 48px}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type="text"]{font:inherit;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
.count{color:var(--muted);font-size:14px;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px}
.tag{font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q{margin:0;font-size:22px;line-height:1.3}
h4{margin:0 0 6px;font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
pre{margin:0;overflow-x:auto;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font:13px/1.65 ui-monospace,Menlo,Consolas,monospace}
.note{background:var(--note-bg);color:var(--note);border:1px solid var(--note);border-radius:6px;padding:12px 14px}
.note h4{color:var(--note)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:600 16px system-ui,sans-serif;min-height:48px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.wide{grid-column:1/-1}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:13px}
.search-btn{background:var(--card);border:1px dashed var(--accent);color:var(--accent);margin-top:10px;width:100%}
</style>
</head>
<body>
<main>
  <h1>Interview Questions Pro</h1>
  <div class="bar">
    <label for="topic" class="hint">Topic</label>
    <select id="topic"></select>
    <input type="text" id="search" placeholder="Search questions..." style="flex-grow:1;">
    <span class="count" id="count"></span>
  </div>
  <section class="card" id="card"></section>
  <div class="btns">
    <button class="primary wide" id="show">Show answer</button>
    <button id="prev">Previous</button>
    <button id="next">Next random</button>
    <button class="wide" id="bookmark" style="background:var(--code)">★ Bookmark Question</button>
  </div>
  <p class="hint">Keys: space shows answer, right arrow next, left arrow previous, b bookmarks.</p>
</main>
<script>
var TOPICS = [["ssh","SSH and remote access"],["perm","Files and permissions"],["proc","Processes, load and memory"],["disk","Disk, inodes and filesystems"],["pkg","Packages"],["net","DNS and networking"],["web","Web servers"],["wp","WordPress and HTTP errors"],["mail","Email and spam"],["cp","cPanel, firewall, SSL, backups"],["db","MySQL"],["scen","Scenarios"],["misc","Other concepts"],["bookmarks","Bookmarked"]];
var CARDS = [{"t":"ssh","q":"How do you access a server remotely?","say":"I use SSH: ssh username@server_ip. From Windows I use PuTTY or the built-in OpenSSH client. I can log in with a password or with an SSH key.","cmd":"ssh user@203.0.113.10\nssh -p 2222 user@203.0.113.10\nssh -i ~/.ssh/key.pem user@203.0.113.10","note":"\"Connect from a local server to a remote server\" is the same answer.","hot":1},{"t":"ssh","q":"Is it necessary to give -p 22 when you connect?","say":"No. 22 is the default SSH port, so -p is only needed when the server uses a different port.","cmd":"ssh -p 2222 user@203.0.113.10","hot":1},{"t":"ssh","q":"Can we change the default SSH port? Where?","say":"Yes. I change the Port line in /etc/ssh/sshd_config, open the new port in the firewall first, then restart sshd.","pts":["Open the new port in CSF or firewalld first so you do not lock yourself out","Keep your current session open and test a new login in a second window","On SELinux systems, allow the port with semanage","With CSF, add the port to TCP_IN in /etc/csf/csf.conf and run csf -r"],"cmd":"vi /etc/ssh/sshd_config      # Port 2222\nsshd -t                          # check syntax\nsystemctl restart sshd\nssh -p 2222 user@server_ip","note":"Your notes skipped the firewall step. Interviewers like it because it shows you know how people lock themselves out.","hot":1},{"t":"ssh","q":"Username, password and server are correct but you get a password authentication error. What is the cause?","pts":["Wrong port, or you are connecting to a different server","PasswordAuthentication no in sshd_config (key login only)","PermitRootLogin no, when you are logging in as root","AllowUsers or DenyUsers rules","Account locked or password expired","User has a nologin shell","Your IP was blocked by CSF, LFD or fail2ban after failed attempts","Caps lock, keyboard layout, special characters in the password"],"cmd":"grep -Ei 'PasswordAuth|PermitRoot|AllowUsers' /etc/ssh/sshd_config\ntail -f /var/log/secure        # RHEL, AlmaLinux\ntail -f /var/log/auth.log      # Ubuntu, Debian\nchage -l username\ncsf -g YOUR_IP","hot":1},{"t":"ssh","q":"SSH says \"connection refused\". How do you troubleshoot?","pts":["Can I reach the server at all? ping and check the port","Is sshd running?","Is it listening on the port I am using? The port may have changed","Is a firewall (CSF, firewalld, iptables) blocking my IP?","Check /etc/hosts.allow and hosts.deny","If nothing works, use the data center console"],"cmd":"ping server_ip\nnc -zv server_ip 22\nsystemctl status sshd\nss -tulnp | grep sshd\ncsf -g YOUR_IP\niptables -L -n | head -30","note":"Refused means something answered and said no (sshd stopped, wrong port, firewall REJECT). A timeout usually means a firewall DROP or the server is down.","fu":"What if it times out instead of refusing?","hot":1},{"t":"ssh","q":"What is the SSH config file?","pts":["Server side: /etc/ssh/sshd_config. Port, PermitRootLogin, PasswordAuthentication, PubkeyAuthentication, AllowUsers","Client side: ~/.ssh/config. Host alias, HostName, User, Port, IdentityFile","Test sshd_config with sshd -t before restarting"],"cmd":"# ~/.ssh/config\nHost web1\n    HostName 203.0.113.10\n    User admin\n    Port 2222\n    IdentityFile ~/.ssh/id_ed25519\n\nssh web1","hot":1},{"t":"ssh","q":"How do you upload files from your computer to the server (backend)?","say":"Over SSH, using scp or rsync, or SFTP with a tool like WinSCP or FileZilla.","cmd":"scp file.txt user@server:/path/\nscp -P 2222 -r folder/ user@server:/path/\nrsync -avz file.txt user@server:/path/\nrsync -avz -e \"ssh -p 2222\" folder/ user@server:/path/\nsftp user@server","note":"Port flag: scp uses capital -P, ssh uses small -p, rsync needs -e \"ssh -p 2222\".","hot":1},{"t":"ssh","q":"You changed some files locally after transferring. Which tool sends only the changes?","say":"rsync. It compares files and transfers only what changed, so repeat uploads are fast.","pts":["The trailing slash on the source matters: folder/ copies the contents, folder copies the folder itself","-n does a dry run, so use it first","--delete removes files on the server that no longer exist locally. Use with care"],"cmd":"rsync -avz --progress /local/path/ user@remote:/remote/path/\nrsync -avzn /local/path/ user@remote:/remote/path/   # dry run","hot":1},{"t":"ssh","q":"How do you see who is logged in and the login history?","cmd":"who\nw\nlast | head\nlastb | head      # failed logins"},{"t":"perm","q":"Explain file permissions and ownership.","say":"Every file has an owner, a group and three permission sets: owner, group and others. Each set has read, write and execute.","pts":["r = 4, w = 2, x = 1, and you add them: rwx = 7, rw- = 6, r-x = 5, r-- = 4","On a directory, x lets you enter it, r lets you list it, w lets you create and delete files in it","chmod changes permissions, chown changes owner and group"],"cmd":"ls -l file.txt\nchmod 644 file.txt\nchmod u+x script.sh\nchown user:group file.txt\nchown -R user:group /path","hot":1},{"t":"perm","q":"What does 644 mean?","say":"Owner can read and write, group can read, others can read. It is the usual permission for normal files.","cmd":"chmod 644 file.txt   # -rw-r--r--","hot":1},{"t":"perm","q":"What does 755 mean?","say":"Owner can read, write and execute. Group and others can read and execute. It is the usual permission for directories and scripts.","cmd":"chmod 755 dir_or_script   # -rwxr-xr-x","hot":1},{"t":"perm","q":"Explain 775.","say":"Owner rwx, group rwx, others r-x. It is used for shared directories where a group needs to write but everyone else only reads.","cmd":"chmod 775 /shared   # drwxrwxr-x","hot":1},{"t":"perm","q":"What does 641 mean?","pts":["6 = rw- for the owner","4 = r-- for the group","1 = --x for others","It is an unusual mode: others can only execute"],"cmd":"chmod 641 file   # -rw-r----x","hot":1},{"t":"perm","q":"Which permission stops others from editing a file?","pts":["Remove write for others. 644 gives others read only. 640 gives others nothing","chmod o-w removes only the write bit and leaves the rest alone"],"cmd":"chmod 644 file\nchmod 640 file\nchmod o-w file","note":"Your notes gave only 640. Both 644 and 640 are correct. 640 is stricter."},{"t":"perm","q":"Change all files in a folder to 644 with a single command.","cmd":"find /your/folder -type f -exec chmod 644 {} \\;\nfind /your/folder -type d -exec chmod 755 {} \\;   # folders need x","note":"chmod -R 644 also hits directories and removes x, so you can no longer enter them. Use find with -type f.","hot":1},{"t":"perm","q":"Find files under a directory modified in the last 5 minutes.","say":"I use find with -mmin. -mmin -5 means modified less than 5 minutes ago.","pts":["-type f limits it to files","-mmin is minutes, -mtime is days"],"cmd":"find /path/to/dir -type f -mmin -5\nfind /path/to/dir -type f -mmin -5 -ls     # with details\nfind /path/to/dir -type f -mtime -1        # last 24 hours","hot":1},{"t":"perm","q":"Get the last five modified files.","cmd":"ls -t | head -5\nls -lt | head -6                     # first line is \"total\", so use 6\nfind . -type f -printf '%T@ %p\\n' | sort -nr | head -5   # recursive","note":"ls -lt | head -n 5 prints the \"total\" line plus only four files. Use head -6, or ls -t.","hot":1},{"t":"perm","q":"What is the \"s\" in rws? Explain special permissions.","say":"The s is SetUID. The program runs with the permissions of the file owner, not the user who runs it. passwd uses it so normal users can change their password even though /etc/shadow belongs to root.","pts":["SetUID (4): s in the owner position, like rwsr-xr-x. chmod u+s or 4755","SetGID (2): s in the group position. On a directory, new files inherit the group. chmod g+s or 2775","Sticky bit (1): t at the end, like /tmp. Only the file owner can delete their files. chmod +t or 1777","Capital S or T means the execute bit is not set under it"],"cmd":"ls -l /usr/bin/passwd\nchmod 4755 file\nchmod 2775 /shared\nchmod 1777 /shared","hot":1},{"t":"perm","q":"How do you find the permissions of a file?","cmd":"ls -l file\nstat -c '%a %A %U:%G %n' file\ngetfacl file\nlsattr file          # attributes such as immutable","note":"In your notes this question was answered with immutable files. That belongs to the \"prevent deletion\" question."},{"t":"perm","q":"What does rm do and how do you prevent deletion of files?","say":"rm removes files. To prevent deletion I can make a file immutable with chattr +i, or use directory permissions and the sticky bit.","pts":["chattr +i: nobody can modify, delete or rename it, not even root, until the flag is removed","Remove write permission on the parent directory, since deleting needs write on the directory","Sticky bit on shared directories so users delete only their own files","Backups are the real safety net"],"cmd":"rm file.txt\nrm -rf dir/          # careful\nchattr +i file.txt\nlsattr file.txt\nchattr -i file.txt   # remove the flag","hot":1},{"t":"perm","q":"You created a file with touch, added content, then ran the command again by mistake. What happens?","say":"touch on an existing file only updates its timestamps. The content stays.","pts":["If the repeated command was echo \"text\" > file, the file is overwritten",">> appends instead of overwriting","touch -c does not create the file if it is missing"],"cmd":"touch myfile.txt\necho \"hello\" > myfile.txt     # overwrites\necho \"more\" >> myfile.txt     # appends","hot":1},{"t":"perm","q":"What are lsattr and chattr?","pts":["lsattr lists extended file attributes, chattr changes them","+i immutable: cannot be changed, deleted or renamed","+a append only: can only add to the end, good for logs"],"cmd":"lsattr test.txt\nchattr +i test.txt\nchattr -i test.txt"},{"t":"perm","q":"What does the stat command show?","say":"It shows the file's full details: size, blocks, inode number, link count, permissions in octal and text, owner, group, and the access, modify and change times.","cmd":"stat file.txt\nstat -c '%a %U %s %n' file.txt"},{"t":"perm","q":"Difference between a hard link and a soft link.","say":"A hard link is another name for the same inode, so it shares the same data. A soft link is a small file that points to a path, like a shortcut.","pts":["Delete the original: a hard link still works, a soft link breaks","Hard links cannot cross filesystems and cannot point to directories","Soft links can do both","ls -li shows the same inode number for hard links"],"cmd":"ln original.txt hardlink.txt\nln -s original.txt softlink.txt\nls -li","note":"Your notes called a hard link \"an exact copy\". It is not a copy. It is the same file with a second name.","hot":1},{"t":"perm","q":"Command to list all files.","cmd":"ls -la        # includes hidden files\nls -lah       # human readable sizes\nls -lt        # newest first\nls -R         # recursive"},{"t":"proc","q":"How do you find active processes?","cmd":"ps aux\nps aux --sort=-%cpu | head\ntop\nhtop\npgrep -a nginx","hot":1},{"t":"proc","q":"Show the top 5 CPU processes.","cmd":"ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%cpu | head -n 6","note":"head -n 5 would show the header and only 4 processes. Use 6 for the top 5."},{"t":"proc","q":"What does pstree show?","say":"It shows running processes as a tree, so you can see which process started which.","cmd":"pstree\npstree -p            # with PIDs\npstree username      # processes of one user","note":"Your notes said plain pstree shows the current user's processes. It shows all processes. Give a username to filter."},{"t":"proc","q":"Handling load issues in detail. How do you find the cause and reduce it?","say":"First I confirm it is real load with uptime and top, comparing the load average with the CPU cores. Then I find out whether it is CPU, memory, disk I/O or traffic, find the process or account responsible, limit or fix it, and read the logs for the cause.","pts":["CPU: top, ps aux --sort=-%cpu","Memory and swap: free -h, vmstat. Swapping makes load jump","Disk I/O: iostat -x, iotop. High \"wa\" in top means disk wait","Traffic: many requests from one IP means a bot or attack. Block it in CSF or .htaccess","Web and PHP: too many PHP processes, wp-cron, xmlrpc.php hits, a heavy plugin","MySQL: slow queries, locked tables","cPanel: find the account behind the process, then limit it with LVE or suspend it","Long term: caching, CDN, update plugins, optimise the database, tune PHP-FPM, add resources"],"cmd":"uptime\nnproc\ntop -c\nps aux --sort=-%cpu | head -n 10\nfree -h\niostat -x 1 3\nnetstat -ntu | awk '{print $5}' | cut -d: -f1 | sort | uniq -c | sort -n | tail\nmysqladmin processlist","fu":"The interviewer said to expect deeper questions here. Practise this one out loud.","hot":1},{"t":"proc","q":"What does load average mean?","say":"Three numbers: the average count of processes running or waiting over the last 1, 5 and 15 minutes. On a 4 core server, a load of 4 means fully busy, and well above 4 means work is queuing.","cmd":"uptime\nnproc"},{"t":"proc","q":"How do you check memory usage on a server?","pts":["Look at the \"available\" column in free -h. It is the memory that can really be used","Heavy swap use means memory pressure","The OOM killer logs show when the kernel killed a process for memory"],"cmd":"free -h\nvmstat 1 5\nps aux --sort=-%mem | head\ntop                                # press M to sort by memory\ndmesg | grep -i 'out of memory'","hot":1},{"t":"proc","q":"How do you change the priority of a process or limit resources?","say":"I use nice to set priority at start and renice to change a running process. On cPanel with CloudLinux I prefer LVE limits for user-level resource control.","cmd":"nice -n 10 command\nrenice -n 10 -p PID\nionice -c3 -p PID      # lowest disk priority"},{"t":"proc","q":"How do you stop a process?","cmd":"kill PID           # polite, SIGTERM\nkill -9 PID        # force, last resort\npkill -u username  # all processes of a user\npkill httpd"},{"t":"proc","q":"How do you check, start and restart a service?","cmd":"systemctl status httpd\nsystemctl restart httpd\nsystemctl enable httpd        # start at boot\njournalctl -u httpd -n 50"},{"t":"disk","q":"How do you check disk usage?","cmd":"df -h                       # space per filesystem\ndf -i                       # inodes\ndf -hT                      # with filesystem type\ndu -sh *                    # size of items in this folder\ndu -xh --max-depth=1 / | sort -h | tail","hot":1},{"t":"disk","q":"Difference between du and df.","say":"df asks the filesystem how much space is used in total. du adds up the sizes of the files it can see.","pts":["df: filesystem level, includes deleted files still held open by a process","du: file level, only files and folders it can reach","They differ when files are deleted but open, when something is hidden under a mount point, or when du crosses into other filesystems"],"hot":1},{"t":"disk","q":"/var shows 15 GB with df and 17 GB with du. What causes the difference?","pts":["If df is bigger than du: files were deleted but a process still holds them open, or files are hidden under a mount point","If du is bigger than df: du crossed into other filesystems mounted under /var, or the file is sparse","Use du -x so du stays on one filesystem"],"cmd":"df -h /var\ndu -xsh /var\nlsof +L1\nmount | grep /var","note":"Your note listed df twice, so the direction is unclear. Be ready to explain both directions.","hot":1},{"t":"disk","q":"The disk is full but du shows little usage. What is wrong?","say":"I check df -i first for inodes, then lsof for deleted open files, then look for data hidden under a mount point.","pts":["Inodes are full: df -i","Deleted files still held open by a process: lsof +L1","Files hidden under a mount point"],"cmd":"df -i\nlsof +L1\nmount --bind / /mnt/root && du -sh /mnt/root/*","hot":1},{"t":"disk","q":"Explain the relation between inodes and disk space.","say":"An inode stores a file's metadata: owner, permissions, size, timestamps and where the data blocks are. Every file and directory uses one inode. A disk can run out of space or out of inodes.","pts":["df -h full, df -i low: a few big files","df -h free, df -i full: millions of small files such as mail queues, sessions, cache","Fix: delete the small files, for example in /var/spool, /tmp or a cache folder"],"cmd":"df -i\nfind /var -xdev -type f | cut -d/ -f1-4 | sort | uniq -c | sort -n | tail","hot":1},{"t":"disk","q":"You deleted a file but disk usage did not change. Why?","pts":["A process still holds the deleted file open","You deleted from a different mount point","Filesystem has not released the blocks yet"],"cmd":"lsof +L1\nsystemctl restart httpd              # restart the holder\n: > /proc/PID/fd/FD                  # truncate without restart"},{"t":"disk","q":"Disk usage is high and /etc is the biggest. A friend says delete it. What do you do?","say":"I would not delete /etc. It holds the system's configuration, and removing it can break the server. I would find what inside it is large.","pts":["Confirm / is really the full filesystem with df -h","Usually it is backup copies, old archives or logs placed there by mistake","Take a backup, move large files elsewhere, then check again"],"cmd":"du -sh /etc/* | sort -h | tail\nfind /etc -type f -size +50M","hot":1},{"t":"disk","q":"Delete a file when you only know part of its name.","cmd":"find /path -type f -name '*partialname*'\nfind /path -type f -iname '*.log'\nfind /path -type f -size +100M\nfind /path -type f -name '*partialname*' -delete   # only after checking the list"},{"t":"disk","q":"How do you identify the partitions on a server?","cmd":"df -hT\nlsblk\nblkid\nmount | column -t\ncat /etc/fstab\nfdisk -l"},{"t":"disk","q":"A user cannot write to /data but there is free space. How do you check?","pts":["Mounted read-only? mount shows ro. dmesg may show a remount after errors","Permissions and ownership of /data","Inodes full","Disk quota for the user","Immutable flag","SELinux context"],"cmd":"mount | grep /data\nls -ld /data\ndf -h /data; df -i /data\nlsattr -d /data\nquota -u username\ntouch /data/test","hot":1},{"t":"disk","q":"Explain the Linux directory layout.","pts":["/etc configuration files","/var logs, mail spool, databases and web content (/var/log, /var/lib/mysql)","/home user files, /root the root user","/tmp temporary files","/usr programs and libraries, /bin and /sbin core commands","/boot kernel and GRUB, /opt optional software","/proc and /sys virtual files, /dev devices","cPanel: /home/user/public_html, /var/cpanel, /usr/local/apache"]},{"t":"disk","q":"What filesystems do you know and how are they mounted?","pts":["ext4 and xfs for Linux. xfs is the default on RHEL, AlmaLinux and CentOS 7 and later","NTFS and FAT for Windows, tmpfs for RAM","/etc/fstab lists what mounts at boot","fsck checks ext4 when unmounted. xfs_repair for xfs"],"cmd":"mount /dev/sdb1 /data\numount /data\ncat /etc/fstab\ndf -hT"},{"t":"pkg","q":"Difference between yum and rpm.","say":"rpm installs a single .rpm file and does not fetch dependencies. yum (dnf on newer systems) installs from repositories and resolves dependencies automatically.","pts":["yum is the front end, rpm is the low level tool underneath","On RHEL 8 and later, yum is an alias for dnf"],"hot":1},{"t":"pkg","q":"How do you install PHP 8 using yum or dnf?","pts":["Modular repositories need you to pick a version stream first","Check available streams with dnf module list php","CentOS 7 uses the Remi repo instead","On cPanel use EasyApache 4 or MultiPHP Manager in WHM, not yum"],"cmd":"dnf module reset php          # clear any earlier PHP stream\ndnf module enable php:8.0     # choose the PHP 8.0 stream\ndnf install php php-mysqlnd php-fpm\nphp -v","hot":1},{"t":"pkg","q":"yum fails during a package install. How do you troubleshoot?","pts":["Network: can the server reach the repo? ping, curl","DNS: does the repo hostname resolve?","Repo files in /etc/yum.repos.d/","Another yum process holding the lock","Disk space, wrong system date, GPG key errors","CentOS 7 or 8 repos that moved to the vault after end of life"],"cmd":"ping -c 3 8.8.8.8\ncurl -I http://mirror.example/repo\ndig repo.example.com\nls /etc/yum.repos.d/\nyum clean all\nyum repolist\ndf -h","hot":1},{"t":"pkg","q":"How do you list installed packages and find which package owns a file?","cmd":"rpm -qa | grep php\nyum list installed\nrpm -qf /usr/bin/php        # who owns this file\nrpm -ql httpd               # files in a package\nyum provides '*/semanage'\ndpkg -l                     # Debian, Ubuntu\ndpkg -S /usr/bin/php"},{"t":"pkg","q":"How do you install packages on Ubuntu or Debian?","cmd":"apt update\napt install nginx\napt remove nginx\napt list --installed\ndpkg -i package.deb"},{"t":"net","q":"What is DNS and how does it work step by step?","say":"DNS translates a domain name like example.com into an IP address, like a phone book for the internet.","pts":["1. Browser cache is checked","2. Operating system cache and the /etc/hosts file","3. The recursive resolver (ISP or 8.8.8.8) checks its cache","4. Resolver asks a root server, which points to the TLD server (.com)","5. TLD server points to the domain's authoritative name server","6. Authoritative server returns the IP address","7. Resolver caches it for the TTL and returns it","8. Browser connects to the IP"],"hot":1},{"t":"net","q":"Name the DNS record types.","pts":["A: name to IPv4. AAAA: name to IPv6","CNAME: alias to another name","MX: mail servers, with a priority","TXT: SPF, DKIM, DMARC, verification","NS: the domain's name servers","PTR: reverse lookup, IP to name","SOA: zone authority and serial","SRV and CAA: services and allowed certificate issuers"],"cmd":"dig example.com A +short\ndig example.com MX +short\ndig example.com TXT +short\ndig example.com NS +short\ndig -x 203.0.113.10 +short","hot":1},{"t":"net","q":"What is a glue record?","say":"A glue record is an IP address the parent zone stores for a name server that lives inside the domain it serves.","pts":["Example: ns1.example.com serves example.com. To find ns1 you need example.com, and to find example.com you need ns1. That is a loop","The registry stores the IP of ns1 as glue, which breaks the loop","You set it at the registrar as child name servers or host records"],"cmd":"dig +trace example.com","hot":1},{"t":"net","q":"Name resolution order, /etc/hosts and /etc/resolv.conf.","say":"The system checks /etc/hosts first, then asks the DNS servers listed in /etc/resolv.conf. The order itself is set in /etc/nsswitch.conf.","pts":["/etc/hosts: manual name to IP mapping. Handy to test a site before DNS changes","/etc/resolv.conf: the DNS servers to ask, like nameserver 8.8.8.8","On newer systems NetworkManager or systemd-resolved may rewrite resolv.conf"],"cmd":"cat /etc/hosts\ncat /etc/resolv.conf\ngrep ^hosts /etc/nsswitch.conf     # hosts: files dns\ngetent hosts example.com","hot":1},{"t":"net","q":"A domain is not resolving. What do you check?","pts":["Does the domain have the right name servers at the registrar?","Is the zone and the A record present on those name servers?","Propagation and TTL: old answers may still be cached","Test against a public resolver to separate a local problem from a DNS problem","Local DNS settings and cache"],"cmd":"dig example.com +short\ndig @8.8.8.8 example.com +short\ndig example.com NS +short\ndig +trace example.com\nnslookup example.com\ncat /etc/resolv.conf","hot":1},{"t":"net","q":"Files are uploaded and the site is set. How do we access it in a browser?","say":"Point the domain's A record to the server IP, or test with the IP or a hosts file entry. The web server must be running with a vhost for the domain, the document root must hold the files and an index file, and ports 80 and 443 must be open.","pts":["To preview before DNS, add \"server_ip example.com\" to the hosts file on your computer"],"cmd":"curl -I http://server_ip\ncurl -I -H 'Host: example.com' http://server_ip\nsystemctl status httpd\nss -tulnp | grep -E ':80|:443'","hot":1},{"t":"net","q":"How do you check whether a port is open or blocked?","pts":["Is anything listening on it? ss -tulnp","Is the firewall blocking it? Check CSF or iptables","Test from outside the server with nc or telnet"],"cmd":"ss -tulnp | grep :80\ncsf -g IP_ADDRESS\niptables -L -n\nnc -zv server_ip 80","note":"netstat -tlnp only shows what is listening. It does not tell you whether a firewall blocks the port."},{"t":"net","q":"Basic network commands.","cmd":"ip a            # addresses\nip r            # routes\nss -tulnp       # listening ports\nping -c 3 host\ntraceroute host\ncurl -I https://example.com\ndig example.com"},{"t":"web","q":"Difference between Apache and Nginx.","say":"Apache is process driven and flexible, with .htaccess and many modules. Nginx is event driven and handles many connections and static files with less memory. Many sites run Nginx in front of Apache.","pts":["Architecture: Apache uses processes or threads (prefork, worker, event). Nginx uses an asynchronous event loop","Static content and high concurrency: Nginx is lighter","Dynamic content: Apache can run PHP in-process. Nginx passes to PHP-FPM",".htaccess: Apache supports it per directory. Nginx does not, so changes need a config edit and reload","Config: Apache vhosts, Nginx server blocks","cPanel servers usually run Apache, sometimes LiteSpeed"],"note":"Your notes had no answer for this one, and the interviewer listed it.","hot":1},{"t":"web","q":"How do you check that the web server configuration syntax is OK?","cmd":"apachectl configtest      # or httpd -t\nnginx -t\nsystemctl reload httpd       # apply without dropping connections\nsystemctl reload nginx","hot":1},{"t":"web","q":"Challenges faced while configuring a web server.","pts":["Port conflict: another service already on 80 or 443","Firewall or SELinux blocking access","Wrong document root","File permissions and ownership for the web user","Virtual host misconfiguration showing the wrong site","Syntax errors stopping the server from starting","Missing index file giving 403"],"cmd":"ss -tulnp | grep ':80'\napachectl configtest\nls -ld /var/www/html\ngetenforce\nausearch -m avc -ts recent"},{"t":"web","q":"Explain the Order deny,allow rule.","say":"It sets the order Apache evaluates Allow and Deny rules. With Order deny,allow, Deny rules run first, then Allow rules, and a request that matches neither is allowed. If it matches both, Allow wins.","cmd":"Order deny,allow\nDeny from all\nAllow from 192.168.1.100\n\n# Apache 2.4 style\nRequire ip 192.168.1.100","note":"Order, Allow and Deny are Apache 2.2 syntax. Apache 2.4 uses Require. Mention both.","hot":1},{"t":"web","q":"What is .htaccess and what do you use it for?","say":".htaccess is a per-directory Apache configuration file. I use it for WordPress permalink rewrites, redirects, forcing HTTPS, blocking IPs and custom error pages.","pts":["Needs AllowOverride All in the vhost","A syntax error causes a 500 error","To test, rename it to .htaccess.bak and reload the site"],"cmd":"# BEGIN WordPress\n<IfModule mod_rewrite.c>\nRewriteEngine On\nRewriteBase /\nRewriteRule ^index\\.php$ - [L]\nRewriteCond %{REQUEST_FILENAME} !-f\nRewriteCond %{REQUEST_FILENAME} !-d\nRewriteRule . /index.php [L]\n<\/IfModule>\n# END WordPress","hot":1},{"t":"web","q":"How do you block a country?","pts":["CSF country block: CC_DENY in /etc/csf/csf.conf, needs the GeoIP database","Cloudflare firewall rule by country",".htaccess with the country's IP ranges. Works but is long and goes out of date","ModSecurity or a GeoIP module"],"cmd":"# .htaccess\n<Limit GET POST>\nOrder Allow,Deny\nAllow from all\nDeny from 1.2.3.0/24\n<\/Limit>","note":"Your notes only had the .htaccess method. CSF or Cloudflare are easier to maintain."},{"t":"web","q":"Many hits are coming to the contact form. How do you restrict them?","say":"I add reCAPTCHA and a honeypot field so bots are blocked without bothering real users, and rate limit submissions so one source cannot flood the form or the mail queue.","pts":["Honeypot: a hidden field only bots fill in","Rate limiting: per IP at the firewall or web server, and per hour on the mail account sending the form","Block abusive IPs in CSF or Cloudflare"],"note":"Say only what you really did. If you did not set up SMTP rate limiting yourself, describe it as an option."},{"t":"web","q":"Where are the web server logs?","pts":["Apache on RHEL family: /var/log/httpd/error_log and access_log","Apache on Debian and Ubuntu: /var/log/apache2/","cPanel: /usr/local/apache/logs/error_log and per-domain logs in /usr/local/apache/domlogs/","Nginx: /var/log/nginx/error.log","PHP-FPM: /var/log/php-fpm/"],"cmd":"tail -f /var/log/httpd/error_log\ngrep ' 500 ' /var/log/httpd/access_log | tail"},{"t":"wp","q":"WordPress shows a white screen. How do you fix it?","say":"A blank page usually means a fatal PHP error with error display turned off. I check the error log, turn on WP_DEBUG logging, then disable plugins and the theme.","pts":["Read the PHP or Apache error log first","Set WP_DEBUG and WP_DEBUG_LOG in wp-config.php","Disable all plugins by renaming wp-content/plugins","Switch to a default theme","Raise the PHP memory limit","Check the PHP version fits the plugins and theme"],"cmd":"tail -n 50 error_log\nmv wp-content/plugins wp-content/plugins.off\nwp plugin deactivate --all\nwp theme activate twentytwentyfour","note":"Your notes also had a white screen answer about Windows. For this role, answer for WordPress.","hot":1},{"t":"wp","q":"404 error on WordPress posts and pages. How do you fix it?","say":"If the home page works but posts return 404, it is almost always a permalink or rewrite problem.","pts":["Settings, then Permalinks, then Save","Check that .htaccess exists and holds the WordPress rewrite block","Check mod_rewrite is enabled and AllowOverride All is set","On Nginx, the config needs try_files $uri $uri/ /index.php?$args;"],"cmd":"wp rewrite flush --hard\nls -la .htaccess\napachectl -M | grep rewrite","hot":1},{"t":"wp","q":"500 internal server error on WordPress. How do you fix it?","pts":["Read the error log first. It names the cause","Disable plugins: wp plugin deactivate --all, or rename the folder","Rename .htaccess and reload. A broken rule gives a 500","Raise PHP memory_limit","Check file permissions and ownership"],"cmd":"tail -n 50 /var/log/httpd/error_log\nwp plugin deactivate --all\nmv .htaccess .htaccess.bak","note":"In your notes wp rewrite flush was under 500. That command fixes 404 permalinks.","hot":1},{"t":"wp","q":"403 Forbidden. What causes it?","pts":["Wrong permissions: 755 for directories, 644 for files","Wrong ownership","No index file and directory listing is off","Deny rules in .htaccess","ModSecurity rule or a CSF block of your IP","Wrong document root, or SELinux context"],"cmd":"ls -ld /path/to/site\nls -l /path/to/site | head\ntail /var/log/httpd/error_log\ncsf -g YOUR_IP","hot":1},{"t":"wp","q":"Which WP-CLI commands do you know?","pts":["Run inside the WordPress folder, as the site user","Add --allow-root if you are root"],"cmd":"wp core version\nwp core update\nwp core verify-checksums\nwp plugin list\nwp plugin deactivate --all\nwp theme list\nwp theme activate twentytwentyfour\nwp rewrite flush\nwp cache flush\nwp user list\nwp user update 1 --user_pass='NewPass123'\nwp option get siteurl\nwp search-replace 'http://old.com' 'https://new.com'\nwp db check","hot":1},{"t":"wp","q":"\"Error establishing a database connection\". What do you check?","pts":["DB name, user, password and host in wp-config.php","MySQL is running","Database server is out of disk or memory","The database user has rights to that database","Port 3306 if the DB is remote"],"cmd":"systemctl status mysqld\nmysql -u dbuser -p dbname\ngrep DB_ wp-config.php\nwp db check"},{"t":"wp","q":"Explain the 400 and 500 family of HTTP errors.","pts":["4xx are client side, 5xx are server side","400 Bad Request: malformed request","401 Unauthorized: login needed or failed","403 Forbidden: access denied","404 Not Found","405 Method Not Allowed: wrong method such as POST on a GET only URL","408 Request Timeout, 429 Too Many Requests: rate limited","500 Internal Server Error: generic failure such as a PHP crash or bad .htaccess","502 Bad Gateway: bad reply from upstream, for example PHP-FPM is down","503 Service Unavailable: overloaded or in maintenance","504 Gateway Timeout: upstream too slow"],"note":"506 to 511 are rare. Know 500, 502, 503 and 504 well.","hot":1},{"t":"wp","q":"Different website issues and how you troubleshoot them.","say":"My method is the same each time: reproduce the problem, read the logs, isolate the cause by disabling plugins, the theme or .htaccess, fix it, verify it, and note it down.","pts":["Slow: check server load, enable caching, optimise images, reduce external scripts, test with GTmetrix","White screen: error log, plugins, memory limit","404: permalinks, .htaccess","500: logs, .htaccess, plugins, PHP limits","Database error: wp-config.php, MySQL service","Plugin conflict: disable one by one, check the browser console","Redirect loop: siteurl and home settings, force HTTPS plugin, Cloudflare SSL mode"],"hot":1},{"t":"mail","q":"Email receiving issue. What do you check?","pts":["MX records point to the right mail server, and that name has an A record","On cPanel, the email routing setting (local or remote)","Mailbox is not full","Mail service is running and port 25 is open in the firewall","Mail logs show the incoming attempt","DNS propagation, and whether your IP is blacklisted"],"cmd":"dig example.com MX +short\ndig mail.example.com A +short\nnc -zv mail.example.com 25\ngrep user@example.com /var/log/exim_mainlog | tail\ndf -h /home","hot":1},{"t":"mail","q":"Mails from our domain go to spam. Explain SPF and DKIM.","say":"SPF lists which servers may send mail for the domain. DKIM signs each message so the receiver can verify it was not changed. DMARC tells receivers what to do when SPF or DKIM fail.","pts":["SPF: a TXT record on the domain, like v=spf1 +a +mx ip4:203.0.113.10 ~all","DKIM: the server signs with a private key. The public key is a TXT record at selector._domainkey.example.com","DMARC: a TXT record at _dmarc.example.com with a policy and report address","Other causes: the server IP is blacklisted, no matching reverse DNS (PTR), a compromised account sending spam, spammy content, a new IP with no reputation"],"cmd":"dig example.com TXT +short\ndig default._domainkey.example.com TXT +short\ndig _dmarc.example.com TXT +short\ndig -x SERVER_IP +short","fu":"Test by sending to Gmail and using \"Show original\" to see SPF, DKIM and DMARC results.","hot":1},{"t":"mail","q":"How do you handle spamming from your server? (expect deeper questions)","say":"First stop the damage, then find the source, then clean up and prevent a repeat.","pts":["Stop: check the queue size, find the sender, suspend outgoing mail for that account and change its password","Find: exim_mainlog, then find the script directory that sent the mail","Clean: remove the malware or spam script, delete the queued spam, update vulnerable plugins","Prevent: limit emails per hour per domain in WHM, SPF, DKIM and DMARC, strong passwords, CSF and ModSecurity, queue alerts","If blacklisted, find out which list, fix the cause, then request delisting"],"cmd":"exim -bpc                                  # messages in queue\nexim -bp | exiqsumm | sort -n | tail         # queue by domain\ngrep 'cwd=' /var/log/exim_mainlog | grep -v /var/spool | awk -F'cwd=' '{print $2}' | awk '{print $1}' | sort | uniq -c | sort -n | tail\nexiqgrep -i -f spammer@example.com | xargs exim -Mrm","hot":1},{"t":"mail","q":"How do you identify spam mails on a Linux server?","pts":["A queue far larger than usual, many frozen messages","One sender or one subject repeated","Many recipients that do not exist"],"cmd":"mailq\nexim -bp\nexim -bpc\nexim -Mvh MESSAGE_ID     # headers\nexim -Mvb MESSAGE_ID     # body","hot":1},{"t":"mail","q":"Mail ports and mail logs.","pts":["SMTP 25, SMTPS 465, submission 587","POP3 110, POP3S 995","IMAP 143, IMAPS 993","cPanel logs: /var/log/exim_mainlog for sending and receiving, /var/log/maillog for Dovecot","Many providers block outbound port 25"],"hot":1},{"t":"cp","q":"What are the cPanel ports?","pts":["cPanel: 2082 (HTTP), 2083 (HTTPS)","WHM: 2086 (HTTP), 2087 (HTTPS)","Webmail: 2095 (HTTP), 2096 (HTTPS)","Also: SSH 22, web 80 and 443, MySQL 3306"],"note":"Your notes had 2087 for WHM but not 2086.","hot":1},{"t":"cp","q":"How do you take a full backup of an account from the backend?","say":"I use /scripts/pkgacct username. It creates one archive with the files, databases, mail and settings. Manually, I tar public_html and dump the database.","pts":["Copy the backup off the server"],"cmd":"/scripts/pkgacct username /backup\nls -lh /backup/cpmove-username.tar.gz\ntar -czf site-files.tar.gz /home/username/public_html\nmysqldump -u dbuser -p dbname > db_backup.sql\nrsync -avz /backup/ user@backup-server:/backups/","hot":1},{"t":"cp","q":"Restore, suspend and terminate a cPanel account from the command line.","cmd":"/scripts/restorepkg /backup/cpmove-username.tar.gz\n/scripts/suspendacct username \"reason\"\n/scripts/unsuspendacct username\n/scripts/removeacct username        # permanent\nls /var/cpanel/suspended/           # suspended accounts","note":"Take a backup before removeacct. It cannot be undone."},{"t":"cp","q":"Where is the cPanel accounting log?","say":"/var/cpanel/accounting.log. It records account creation, removal, suspension and unsuspension.","cmd":"grep username /var/cpanel/accounting.log"},{"t":"cp","q":"What files are required to install an SSL certificate?","pts":["Certificate file (.crt)","Private key (.key). It is created with the CSR. Keep it secret","CA bundle (.ca-bundle or .pem), the intermediate chain"],"hot":1},{"t":"cp","q":"How is an SSL certificate installed?","say":"Get a certificate, free from Let's Encrypt or AutoSSL, or buy one. On cPanel I paste the certificate, key and CA bundle in SSL/TLS, Manage SSL Sites. On a plain server I set the paths in the Apache or Nginx config and reload.","cmd":"# Apache\nSSLEngine on\nSSLCertificateFile /etc/ssl/certs/yourdomain.crt\nSSLCertificateKeyFile /etc/ssl/private/yourdomain.key\nSSLCertificateChainFile /etc/ssl/certs/ca_bundle.crt\n\n# Nginx\nlisten 443 ssl;\nssl_certificate /etc/ssl/certs/yourdomain.crt;\nssl_certificate_key /etc/ssl/private/yourdomain.key;\n\n# verify and check expiry\nopenssl s_client -connect example.com:443 -servername example.com | openssl x509 -noout -dates","note":"On Apache 2.4.8 and later, SSLCertificateChainFile is deprecated. Put the full chain in SSLCertificateFile. Nginx also needs the full chain in ssl_certificate.","hot":1},{"t":"cp","q":"How do you whitelist an IP in CSF?","pts":["Or add the IP to /etc/csf/csf.allow","LFD blocks IPs after failed logins"],"cmd":"csf -a 203.0.113.5 \"office\"      # allow\ncsf -g 203.0.113.5                # is it blocked? why?\ncsf -dr 203.0.113.5               # remove from deny list\ncsf -tr 203.0.113.5               # remove temporary block\ncsf -r                            # restart CSF","hot":1},{"t":"cp","q":"Which operating systems and firewalls are you familiar with?","say":"I have worked with CentOS, AlmaLinux, Ubuntu and Debian. For firewalls: CSF, UFW, firewalld and iptables.","cmd":"firewall-cmd --permanent --add-port=2222/tcp && firewall-cmd --reload\nufw allow 2222/tcp\niptables -A INPUT -p tcp --dport 2222 -j ACCEPT\ncsf -a IP","note":"Keep only the names you can answer follow-ups for, such as how to open a port in each one.","hot":1},{"t":"cp","q":"What is LVE?","say":"LVE (Lightweight Virtual Environment) is a CloudLinux feature that isolates each user's resource use on a shared server, so one cPanel account cannot use all the CPU, RAM or I/O.","pts":["Limits include CPU, memory, I/O and number of processes","CloudLinux only"],"cmd":"lveinfo --period=1h --order-by=cpu_avg --limit=5"},{"t":"db","q":"How do you connect to MySQL with a username and password?","pts":["The default port is 3306"],"cmd":"mysql -u username -p\nmysql -u username -p -h 127.0.0.1 -P 3306 dbname"},{"t":"db","q":"What are SELECT, UPDATE, DELETE and DROP used for? Which can you kill?","pts":["SELECT reads data","UPDATE changes data","DELETE removes rows","DROP removes a whole table or database","Killing a SELECT is safe, it only reads","Killing an UPDATE or DELETE makes InnoDB roll back, which can take time. Check before killing","Do not kill a DROP or ALTER halfway"],"cmd":"SHOW FULL PROCESSLIST;\nKILL QUERY 1234;    -- stops the statement, keeps the connection\nKILL 1234;          -- ends the connection","note":"Your notes had the commands but not which query is safe to kill.","hot":1},{"t":"db","q":"A developer needs database access. What is the default port and how do you grant it safely?","pts":["Default port 3306","cPanel: add the developer's IP under Remote MySQL","Create a user limited to that host and database, with only the rights needed","Allow port 3306 in the firewall only for that IP","An SSH tunnel is safer than opening the port"],"cmd":"CREATE USER 'dev'@'203.0.113.5' IDENTIFIED BY 'StrongPass';\nGRANT SELECT,INSERT,UPDATE ON dbname.* TO 'dev'@'203.0.113.5';\n\nssh -L 3307:127.0.0.1:3306 user@server","hot":1},{"t":"db","q":"How do you back up and restore a database?","cmd":"mysqldump -u dbuser -p dbname > db_backup.sql\nmysql -u dbuser -p dbname < db_backup.sql"},{"t":"db","q":"How do you find slow queries?","pts":["Add indexes for columns used in WHERE and JOIN"],"cmd":"mysqladmin -u root -p processlist\nSHOW FULL PROCESSLIST;\nSET GLOBAL slow_query_log = 1;\nSET GLOBAL long_query_time = 2;\nEXPLAIN SELECT * FROM table WHERE col = 'x';"},{"t":"scen","q":"Handling a server down issue.","say":"First I ping the IP and check which ports respond to tell a network problem from a server problem. If I cannot reach it, I use the data center portal to check status and reboot if needed. If console access is available, I inspect boot messages, disk and services to find the cause.","pts":["Ping, then test ports 22, 80 and 443","Data center portal: power state, console, reboot","After it is back: uptime, last reboot, logs (journalctl -b -1, /var/log/messages)","Look for out of memory kills, a full disk, disk errors, failed services","Rescue mode: boot a rescue image, mount the disk, read logs, fix fstab or GRUB, then reboot","Update the customer, then write the cause and prevention"],"cmd":"ping server_ip\nnc -zv server_ip 22\nuptime; last reboot | head\njournalctl -b -1 -p err | tail\ndmesg | grep -iE 'oom|error'\ndf -h; free -h","note":"Your notes say you have not used rescue mode. Still learn what it is for, they may ask.","hot":1},{"t":"scen","q":"A page loads slowly because of server load. How do you troubleshoot?","pts":["uptime and top: is load high, and which process?","Check CPU, memory and disk I/O","Check MySQL and Apache or PHP-FPM usage","Read error and access logs for floods from one IP","Fix or limit: block abusive IPs, disable the heavy plugin, add caching, restart the service"],"cmd":"uptime\ntop -c\nps aux --sort=-%cpu | head\nmysqladmin processlist\ntail -f /var/log/httpd/error_log","hot":1},{"t":"scen","q":"On a cPanel server, one account is causing high load. What do you do?","pts":["Find the user in top or ps","Find the busy domain from its logs","Limit the account with LVE or suspend it if it is an attack","Fix the cause: plugin, bot traffic, bad script"],"cmd":"ps -u username -o pid,pcpu,pmem,cmd --sort=-pcpu | head\ntail -n 200 /usr/local/apache/domlogs/example.com | awk '{print $1}' | sort | uniq -c | sort -n | tail"},{"t":"misc","q":"Explain the Linux boot process.","pts":["1. BIOS or UEFI runs POST and finds the bootloader","2. Bootloader (GRUB) loads the kernel and initramfs","3. Kernel starts hardware, mounts the root filesystem","4. systemd starts as the first process (PID 1)","5. systemd reaches the default target and starts services","6. Login prompt appears"],"cmd":"systemctl get-default\nsystemd-analyze","hot":1},{"t":"misc","q":"What is a bootloader? Cold boot vs warm boot?","pts":["A bootloader is a small program that loads the OS kernel into memory and starts it. GRUB is the common one","Cold boot: start from powered off, full hardware check","Warm boot: restart without cutting power, like the reboot command"]},{"t":"misc","q":"What is a CDN?","say":"A Content Delivery Network is a group of servers spread across locations that deliver images, video, scripts and other content to users from a server near them. It lowers latency and improves site speed."},{"t":"misc","q":"GET vs POST.","say":"GET fetches data and puts parameters in the URL. POST sends data in the request body, such as form submissions and logins.","pts":["GET can be cached and bookmarked","POST keeps data out of the URL, browser history and most logs","POST is not secure by itself. HTTPS is what protects the data"],"note":"Your notes said POST sends data securely. Say it hides data from the URL, and HTTPS provides the security."},{"t":"misc","q":"What is ionCube Loader?","say":"It is a PHP extension that lets PHP run files encoded with ionCube. Developers use it to protect their PHP code from being read or copied.","cmd":"php -v    # shows if the ionCube loader is active"},{"t":"misc","q":"What is SELinux?","pts":["A kernel security layer that limits what processes can access, on top of normal permissions","Modes: enforcing, permissive, disabled","Common cause of \"permission denied\" when permissions look fine"],"cmd":"getenforce\nsetenforce 0             # temporary, for testing only\nls -Z /var/www/html\nrestorecon -Rv /var/www/html\ntail /var/log/audit/audit.log"},{"t":"misc","q":"How do you schedule a job with cron?","cmd":"crontab -e\n# minute hour day month weekday command\n*/5 * * * * /path/script.sh\n0 2 * * * /usr/bin/php /home/user/cron.php\ncrontab -l\ntail /var/log/cron"}];

var card = document.getElementById('card');
var showBtn = document.getElementById('show');
var bookmarkBtn = document.getElementById('bookmark');

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function topicName(k){ for (var i=0;i<TOPICS.length;i++){ if (TOPICS[i][0]===k) return TOPICS[i][1]; } return k; }

function initTopics(){
  topicSel.innerHTML = '<option value="all">All topics</option><option value="hot">Asked often</option><option value="bookmarks">Bookmarked ('+bookmarks.length+')</option>' +
    TOPICS.filter(function(t){ return t[0]!=='bookmarks' && CARDS.some(function(c){ return c.t===t[0]; }); })
          .map(function(t){ return '<option value="'+t[0]+'">'+esc(t[1])+'</option>'; }).join('');
}

function build(){
  var v = topicSel.value;
  var q = searchInput.value.toLowerCase().trim();
  
  var list = CARDS.filter(function(cardObj){
    var matchesTopic = v==='all' ? true : v==='hot' ? !!cardObj.hot : v==='bookmarks' ? bookmarks.includes(cardObj.q) : cardObj.t===v;
    var matchesSearch = q === '' || cardObj.q.toLowerCase().includes(q) || (cardObj.say && cardObj.say.toLowerCase().includes(q));
    return matchesTopic && matchesSearch;
  });

  deck = shuffle(list.slice()); pos = 0; shown = false; render();
}

function render(){
  if (deck.length === 0) {
    document.getElementById('count').textContent = '0 of 0';
    card.innerHTML = '<p class="hint">No questions match your filter or search criteria.</p>';
    showBtn.style.display = 'none';
    return;
  }
  showBtn.style.display = 'block';
  var c = deck[pos];
  var isBookmarked = bookmarks.includes(c.q);
  bookmarkBtn.textContent = isBookmarked ? '★ Bookmarked' : '☆ Bookmark Question';
  
  document.getElementById('count').textContent = (pos+1) + ' of ' + deck.length;
  var h = '<div class="tag">' + esc(topicName(c.t)) + (c.hot ? ' · asked often' : '') + '</div><h2 class="q">' + esc(c.q) + '</h2>';
  if (shown) {
    if (c.say) h += '<div><h4>Say it like this</h4><p>' + esc(c.say) + '</p></div>';
    if (c.pts) h += '<div><h4>Key points</h4><ul>' + c.pts.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('') + '</ul></div>';
    if (c.cmd) h += '<div><h4>Commands</h4><pre><code>' + esc(c.cmd) + '</code></pre></div>';
    if (c.note) h += '<div class="note"><h4>Check this</h4><p>' + esc(c.note) + '</p></div>';
    if (c.fu) h += '<div><h4>They may ask next</h4><p>' + esc(c.fu) + '</p></div>';
    h += '<button class="search-btn" onclick="searchGoogle()">🔍 Search on Google & AI Mode</button>';
  } else {
    h += '<p class="hint">Say your answer out loud, then tap Show answer.</p>';
  }
  card.innerHTML = h;
  showBtn.textContent = shown ? 'Hide answer' : 'Show answer';
}

function next(){ pos++; if (pos >= deck.length) { deck = shuffle(deck); pos = 0; } shown = false; render(); window.scrollTo(0,0); }
function prev(){ pos = (pos - 1 + deck.length) % deck.length; shown = false; render(); window.scrollTo(0,0); }
function toggle(){ shown = !shown; render(); }

function toggleBookmark(){
  if (deck.length === 0) return;
  var c = deck[pos];
  var idx = bookmarks.indexOf(c.q);
  if (idx > -1) {
    bookmarks.splice(idx, 1);
  } else {
    bookmarks.push(c.q);
  }
  localStorage.setItem('interview_bookmarks', JSON.stringify(bookmarks));
  initTopics();
  render();
}

function searchGoogle() {
  var c = deck[pos];
  var query = encodeURIComponent(c.q);
  window.open('https://www.google.com/search?q=' + query, '_blank');
}

showBtn.addEventListener('click', toggle);
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
bookmarkBtn.addEventListener('click', toggleBookmark);
topicSel.addEventListener('change', build);
searchInput.addEventListener('input', build);

document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.metaKey || e.ctrlKey) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'b' || e.key === 'B') toggleBookmark();
});

initTopics();
build();
</script>
</body>
</html>
